<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Geo Tracker — Modern Neobrutalism</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* ==========================================
     SETUP & FONTS
     ========================================== */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
  
  :root {
    --bg-main: #F4F4F0;
    --black: #000000;
    --white: #FFFFFF;
    --pink: #FF3B5C;
    --cyan: #00E5FF;
    --yellow: #FFDE00;
    --gray: #E2E8F0;
  }

  body { 
    background-color: var(--bg-main); 
    color: var(--black); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    overflow-x: hidden;
    /* Pattern Grid Modern */
    background-image: radial-gradient(var(--black) 1px, transparent 1px);
    background-size: 20px 20px;
    background-position: 0 0;
  }

  /* Utilitas Garis Tebal */
  .neo-border { border: 3px solid var(--black); box-shadow: 6px 6px 0px var(--black); }
  .neo-border-thin { border: 2px solid var(--black); box-shadow: 4px 4px 0px var(--black); }

  /* ==========================================
     LAYAR SIDIK JARI (SCANNER)
     ========================================== */
  #scanner-screen {
    position: fixed; inset: 0; background: var(--yellow); z-index: 9999;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    background-image: radial-gradient(var(--black) 2px, transparent 2px);
    background-size: 25px 25px;
  }

  .fingerprint-container {
    position: relative; width: 180px; height: 180px; border-radius: 36px;
    background: var(--white); display: flex; justify-content: center; align-items: center; 
    cursor: pointer; transition: all 0.2s; overflow: hidden;
  }
  .fingerprint-container:active { transform: translate(6px, 6px); box-shadow: 2px 2px 0px var(--black) !important; }
  
  /* SVG Ikon Sidik Jari */
  .fingerprint-svg { width: 100px; height: 100px; stroke: var(--black); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: 0.3s; z-index: 2; }
  
  /* Overlay Animasi Scan */
  .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 30%, var(--cyan) 50%, transparent 70%); background-size: 100% 200%; opacity: 0; z-index: 1; }
  
  /* State Scanning */
  .fingerprint-container.scanning .scan-overlay { opacity: 1; animation: scanAnim 1.5s linear infinite; }
  .fingerprint-container.scanning .fingerprint-svg { stroke: var(--pink); }
  .fingerprint-container.scanning { border-color: var(--pink); box-shadow: 0 0 20px var(--pink); }

  @keyframes scanAnim { 0% { background-position: 0 -100%; } 100% { background-position: 0 100%; } }

  .scan-text { margin-top: 30px; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; background: var(--white); padding: 10px 20px; border: 3px solid var(--black); box-shadow: 4px 4px 0 var(--black); }

  /* ==========================================
     DASHBOARD UTAMA
     ========================================== */
  .screen { display: none; flex-direction: column; flex: 1; padding: 20px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; width: 100%; }
  .screen.active { display: flex; }

  .header { background: var(--cyan); padding: 20px; text-align: center; margin-bottom: 25px; }
  .header h1 { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

  .page { display: none; animation: slideUp 0.3s ease-out; }
  .page.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  /* --- PAGE 1: INPUT --- */
  .input-card { background: var(--white); padding: 25px; margin-bottom: 20px; }
  .input-card label { display: block; font-weight: 800; font-size: 13px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .input-card input { width: 100%; padding: 16px; font-size: 18px; font-weight: 800; border: 3px solid var(--black); outline: none; margin-bottom: 15px; background: var(--bg-main); transition: 0.2s; }
  .input-card input:focus { background: var(--white); box-shadow: inset 4px 4px 0 rgba(0,0,0,0.05); }
  
  .btn-track { width: 100%; padding: 18px; background: var(--pink); color: var(--white); border: 3px solid var(--black); font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.1s; }
  .btn-track svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; }
  .btn-track:active { transform: translate(4px, 4px); box-shadow: none !important; }
  .btn-track:disabled { background: var(--gray); cursor: not-allowed; }

  .alert-error { background: var(--pink); color: var(--white); padding: 15px; text-align: center; font-weight: 800; border: 3px solid var(--black); margin-top: 15px; display: none; }

  /* --- PAGE 2: INFO --- */
  .info-card { background: var(--white); padding: 20px; }
  .info-row { display: flex; justify-content: space-between; border-bottom: 2px dashed var(--black); padding: 12px 0; font-size: 14px; font-weight: 700; }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #555; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
  .info-value { text-align: right; word-break: break-all; font-weight: 800; font-size: 15px; }

  /* --- PAGE 3: MAP --- */
  .map-wrapper { position: relative; }
  #map { height: 450px; width: 100%; display: none; }
  #map.active { display: block; }
  .map-notice { background: var(--yellow); padding: 15px; font-size: 12px; font-weight: 700; border-bottom: 3px solid var(--black); display: none; text-align: center; line-height: 1.5; }
  .map-notice.active { display: block; }

  /* ==========================================
     BOTTOM NAVIGATION (SVG ICONS)
     ========================================== */
  .bottom-nav { 
    position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); 
    border-top: 3px solid var(--black); display: flex; justify-content: space-around; 
    padding: 12px 0; z-index: 100; box-shadow: 0 -4px 0 rgba(0,0,0,0.1);
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 800; cursor: pointer; color: #999; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
  .nav-item.active { color: var(--black); transform: translateY(-4px); }
  
  /* Styling SVG di Nav */
  .nav-icon { width: 24px; height: 24px; margin-bottom: 5px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .nav-item.active .nav-icon { stroke: var(--pink); }
  
  /* Leaflet Map Customization */
  .leaflet-popup-content-wrapper { border-radius: 0; border: 3px solid var(--black); box-shadow: 4px 4px 0 var(--black); font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
  .leaflet-popup-tip { border: 3px solid var(--black); }
  .leaflet-container { font-family: 'Space Grotesk', sans-serif; }
</style>
</head>
<body>

<!-- ==========================================
     SCANNER SIDIK JARI (MODERN SVG)
     ========================================== -->
<div id="scanner-screen">
  <div class="fingerprint-container neo-border" id="fpBtn">
    <!-- SVG Fingerprint Icon (No Emoji) -->
    <svg class="fingerprint-svg" viewBox="0 0 24 24">
      <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path>
      <path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path>
      <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path>
      <path d="M2 12a10 10 0 0 1 18-6"></path>
      <path d="M2 16h.01"></path>
      <path d="M21.8 16c.2-2 .131-5.354 0-6"></path>
      <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path>
      <path d="M8.65 22c.21-.66.45-1.32.57-2"></path>
      <path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path>
    </svg>
    <div class="scan-overlay"></div>
  </div>
  <div class="scan-text">Pindai Sidik Jari</div>
</div>

<!-- ==========================================
     DASHBOARD APP
     ========================================== -->
<div class="screen" id="app-screen">
  
  <div class="header neo-border">
    <h1>GEO TRACKER</h1>
  </div>

  <!-- PAGE 1: INPUT -->
  <div class="page active" id="page-input">
    <div class="input-card neo-border">
      <label>Target IP Address</label>
      <input type="text" id="ipInput" placeholder="8.8.8.8">
      
      <button class="btn-track neo-border" id="trackBtn" onclick="lacakIP()">
        <!-- SVG Search Icon -->
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Lacak IP
      </button>
    </div>
    <div class="alert-error neo-border-thin" id="errorBox"></div>
  </div>

  <!-- PAGE 2: INFO -->
  <div class="page" id="page-info">
    <div class="info-card neo-border" id="infoCard">
      <div class="info-row"><span class="info-label">IP Address</span><span class="info-value" id="resIP">-</span></div>
      <div class="info-row"><span class="info-label">Negara</span><span class="info-value" id="resNegara">-</span></div>
      <div class="info-row"><span class="info-label">Region / Provinsi</span><span class="info-value" id="resProv">-</span></div>
      <div class="info-row"><span class="info-label">Kota</span><span class="info-value" id="resKota">-</span></div>
      <div class="info-row"><span class="info-label">Kode Pos</span><span class="info-value" id="resPos">-</span></div>
      <div class="info-row"><span class="info-label">ISP Provider</span><span class="info-value" id="resISP">-</span></div>
      <div class="info-row"><span class="info-label">Timezone</span><span class="info-value" id="resTz">-</span></div>
      <div class="info-row"><span class="info-label">Koordinat</span><span class="info-value" id="resKoor">-</span></div>
    </div>
  </div>

  <!-- PAGE 3: MAP -->
  <div class="page" id="page-map">
    <div class="map-wrapper neo-border">
      <div class="map-notice" id="mapNotice">Peta mengarah ke Server ISP / Kota, bukan lokasi rumah spesifik.</div>
      <div id="map"></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION (SVG ICONS) -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchPage('page-input', this)">
      <!-- SVG Search -->
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Lacak</span>
    </div>
    <div class="nav-item" onclick="switchPage('page-info', this)">
      <!-- SVG Info -->
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span>Info</span>
    </div>
    <div class="nav-item" onclick="switchPage('page-map', this)">
      <!-- SVG Map -->
      <svg class="nav-icon" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span>Peta</span>
    </div>
  </div>
</div>

<!-- LEAFLET MAP SCRIPT -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ==========================================
  // 1. SCANNER ANIMATION
  // ==========================================
  const fpBtn = document.getElementById('fpBtn');
  const scannerScreen = document.getElementById('scanner-screen');
  const appScreen = document.getElementById('app-screen');

  function startScan(e) {
    e.preventDefault();
    if (fpBtn.classList.contains('scanning')) return;
    
    // Tambah class scanning untuk memicu animasi CSS
    fpBtn.classList.add('scanning');
    
    // Delay masuk dashboard (1.5 detik)
    setTimeout(() => {
      scannerScreen.style.display = 'none';
      appScreen.classList.add('active');
    }, 1500);
  }
  
  fpBtn.addEventListener('mousedown', startScan);
  fpBtn.addEventListener('touchstart', startScan);

  // ==========================================
  // 2. PAGE NAVIGATION
  // ==========================================
  function switchPage(pageId, navEl) {
    // Sembunyikan halaman
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    // Tampilkan halaman tujuan
    document.getElementById(pageId).classList.add('active');
    
    // Update Nav active state
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    navEl.classList.add('active');

    // Fix bug Leaflet map tidak muncul saat tab diganti
    if (pageId === 'page-map' && map) {
      setTimeout(() => { map.invalidateSize(); }, 200);
    }
  }

  // ==========================================
  // 3. IP TRACKING LOGIC
  // ==========================================
  let map = null;
  let marker = null;

  async function lacakIP() {
    const ip = document.getElementById('ipInput').value.trim();
    const btn = document.getElementById('trackBtn');
    const errorBox = document.getElementById('errorBox');
    const mapDiv = document.getElementById('map');
    const mapNotice = document.getElementById('mapNotice');

    // Reset UI
    errorBox.style.display = 'none';
    mapDiv.style.display = 'none';
    mapNotice.classList.remove('active');

    if (!ip) {
      errorBox.textContent = "Masukkan IP Address terlebih dahulu!";
      errorBox.style.display = 'block';
      return;
    }

    // Loading State
    btn.innerHTML = 'Melacak...';
    btn.disabled = true;

    try {
      // API ipwho.is
      const res = await fetch(`https://ipwho.is/${ip}`);
      const data = await res.json();

      if (!data.success) throw new Error("IP tidak ditemukan");

      // Populate Data
      document.getElementById('resIP').textContent = data.ip;
      document.getElementById('resNegara').textContent = data.country;
      document.getElementById('resProv').textContent = data.region;
      document.getElementById('resKota').textContent = data.city;
      document.getElementById('resPos').textContent = data.postal || '-';
      document.getElementById('resISP').textContent = data.connection.isp;
      document.getElementById('resTz').textContent = data.timezone.id;
      document.getElementById('resKoor').textContent = `${data.latitude}, ${data.longitude}`;

      // Auto switch ke Info Page
      switchPage('page-info', document.querySelectorAll('.nav-item')[1]);

      // Tampilkan Map & Notice
      mapDiv.style.display = 'block';
      mapNotice.classList.add('active');

      // Setup Leaflet Map (Satellite)
      if (data.latitude && data.longitude) {
        if (!map) {
          map = L.map('map', { zoomControl: true, scrollWheelZoom: true }).setView([data.latitude, data.longitude], 13);
          // Esri World Imagery Tile (Satellite)
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
          }).addTo(map);
        } else {
          map.setView([data.latitude, data.longitude], 13);
        }

        // Custom Marker
        if (marker) map.removeLayer(marker);
        marker = L.marker([data.latitude, data.longitude]).addTo(map)
          .bindPopup(`<b>${data.city}</b><br>${data.connection.isp}`)
          .openPopup();
      }

    } catch (err) {
      errorBox.textContent = "IP tidak valid atau tidak ditemukan.";
      errorBox.style.display = 'block';
    } finally {
      // Reset Button
      btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;stroke-width:2.5;fill:none;margin-right:8px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> Lacak IP`;
      btn.disabled = false;
    }
  }

  // Enter Key
  document.getElementById('ipInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') lacakIP();
  });
</script>

</body>
</html>
